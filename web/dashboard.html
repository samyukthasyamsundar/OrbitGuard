<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrbitGuard Ground Station</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='3' fill='%232a78d6'/%3E%3Ccircle cx='8' cy='8' r='6.5' fill='none' stroke='%232a78d6' stroke-width='1.5'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --wash: rgba(11, 11, 11, 0.06);
  --series: #2a78d6;
  --good: #0ca30c;
  --warn: #fab219;
  --crit: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.08);
    --series: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #f0efec;
  --ink2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --wash: rgba(255, 255, 255, 0.08);
  --series: #3987e5;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }

header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 14px; font-weight: 500; margin: 0; }
.sub { margin: 2px 0 0; color: var(--ink2); }

.status {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
  padding: 8px 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 18px; font-weight: 600;
}
.status .detail { font-weight: 400; color: var(--ink2); }
.ico { width: 14px; height: 14px; flex: none; }

.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
.filters .grow { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 2px; gap: 2px; }
button {
  font: inherit; color: var(--ink2); background: transparent; border: 0;
  border-radius: 6px; padding: 6px 12px; cursor: pointer; min-height: 32px;
}
button:hover { background: var(--wash); }
button[aria-pressed="true"] { color: var(--ink); font-weight: 600; background: var(--wash); }
.btn { border: 1px solid var(--border); background: var(--surface); }
button:focus-visible, .plot:focus-visible { outline: 2px solid var(--series); outline-offset: 2px; }

.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.card-label { color: var(--ink2); }
.card-value { white-space: nowrap; }
.card-value .num { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
.card-value .unit { font-size: 14px; color: var(--ink2); margin-left: 4px; }

.chart { position: relative; margin-top: 8px; }
.plot { border-radius: 8px; outline: none; touch-action: pan-y; }
.plot svg { display: block; }
.tick { fill: var(--muted); font-size: 12px; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.axisline { stroke: var(--axis); stroke-width: 1; }
.line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.area { fill: var(--series); fill-opacity: 0.10; stroke: none; }
.dot { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
.xhair { stroke: var(--muted); stroke-width: 1; }

.tip {
  position: absolute; z-index: 2; pointer-events: none; white-space: nowrap;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
}
.tip[hidden] { display: none; }
.tip-time { color: var(--ink2); }
.tip-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.tip-key { width: 12px; height: 2px; background: var(--series); border-radius: 1px; }
.tip-val { font-size: 14px; font-weight: 600; color: var(--ink); }
.tip-name { color: var(--ink2); }


.alerts { display: grid; gap: 8px; margin-bottom: 16px; }
.alert {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px;
  padding: 10px 14px; border-radius: 10px; background: var(--surface);
  border: 1px solid var(--border); border-left-width: 4px;
}
.alert.warning { border-left-color: var(--warn); }
.alert.critical { border-left-color: var(--crit); }
.alert .a-title { font-weight: 600; }
.alert .a-detail { color: var(--ink2); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink); margin-left: 8px; vertical-align: middle; }
.badge .ico { width: 12px; height: 12px; }
.card.has-alert { border-color: var(--axis); }


.security { margin-bottom: 16px; }
.sec-banner { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 10px 14px;
  border-radius: 10px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--crit); }
.sec-banner .a-title { font-weight: 600; }
.sec-banner .a-detail { color: var(--ink2); }


.mapcard { margin-bottom: 16px; }
.mapcard .card-head { margin-bottom: 4px; }
.map-sub { color: var(--ink2); font-size: 12px; }
.map { position: relative; }
.map svg { display: block; width: 100%; height: auto; border-radius: 8px; }
.map-ocean { fill: var(--surface); }
.map-grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.map-equator { stroke: var(--axis); stroke-width: 1; fill: none; }
.map-tick { fill: var(--muted); }
.map-trail { fill: none; stroke: var(--series); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.map-ahead { fill: none; stroke: var(--series); stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 1 5; opacity: 0.7; }
.map-sat { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
.map-sat-ring { fill: none; stroke: var(--series); stroke-width: 1.5; opacity: 0.5; }
.map-gs { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.map-label { fill: var(--ink2); }
.map-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; color: var(--ink2); font-size: 12px; }
.map-legend span { display: inline-flex; align-items: center; gap: 6px; }
.map-legend svg { width: 22px; height: 10px; border-radius: 0; }
.map-readout { margin-top: 4px; font-variant-numeric: tabular-nums; }
.map-na { color: var(--ink2); padding: 24px 0; text-align: center; }

h2.section { margin: 28px 0 12px; color: var(--ink2); }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
.tile .t-label { color: var(--ink2); }
.tile .t-value { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
.tile .t-sub { color: var(--ink2); font-size: 12px; }

.empty { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px 16px; text-align: center; color: var(--ink2); }
.empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
.empty code { background: var(--wash); border-radius: 4px; padding: 1px 6px; }

.tablecard { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 520px; }
caption { text-align: left; color: var(--ink2); padding-bottom: 8px; }
th, td { padding: 6px 12px 6px 0; border-bottom: 1px solid var(--grid); text-align: right; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink2); font-weight: 500; }
[hidden] { display: none !important; }
noscript { display: block; padding: 16px; }

@media (forced-colors: active) {
  .line, .dot, .tip-key { forced-color-adjust: none; stroke: Highlight; }
  .tip-key { background: Highlight; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>OrbitGuard</h1>
      <p class="sub">Satellite telemetry &middot; ground station</p>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">
      <svg class="ico" id="status-icon" viewBox="0 0 16 16" aria-hidden="true"></svg>
      <span id="status-label">Connecting</span>
      <span class="detail" id="status-detail"></span>
    </div>
  </header>

  <div class="filters">
    <div class="seg" role="group" aria-label="Time window" id="windows"></div>
    <span class="grow"></span>
    <button class="btn" id="table-toggle" type="button" aria-pressed="false">Table view</button>
  </div>

  <div class="security" id="security" role="region" aria-label="Security events" aria-live="polite"></div>

  <div class="alerts" id="alerts" role="region" aria-label="Active alerts" aria-live="polite"></div>

  <section class="card mapcard" id="mapcard" hidden aria-labelledby="map-h">
    <div class="card-head">
      <h2 class="card-label" id="map-h">Satellite position</h2>
      <span class="map-sub" id="map-sub"></span>
    </div>
    <div class="map" id="map" tabindex="0" role="img"></div>
    <div class="map-legend" id="map-legend"></div>
    <div class="map-readout" id="map-readout" aria-live="off"></div>
  </section>

  <div class="empty" id="empty" hidden>
    <strong>Waiting for telemetry</strong>
    Start <code>satellite_sim</code> with <code>--port</code> set to this ground station&rsquo;s UDP port.
  </div>

  <main class="grid" id="charts" hidden></main>

  <section id="table-view" class="tablecard" hidden>
    <table id="table"></table>
  </section>

  <h2 class="section">Link health</h2>
  <div class="tiles" id="tiles"></div>
  <noscript>This dashboard needs JavaScript.</noscript>
</div>

<script>
(function () {
  'use strict';
  var SVGNS = 'http://www.w3.org/2000/svg';

  var METRICS = [
    { key: 'battery', label: 'Battery', unit: '%', domain: [0, 100] },
    { key: 'temp', label: 'Temperature', unit: '°C', minSpan: 2 },
    { key: 'cpu', label: 'CPU utilization', unit: '%', domain: [0, 100] },
    { key: 'signal', label: 'Signal strength', unit: 'dBm', minSpan: 4 }
  ];
  var METRIC_BY_KEY = { battery: 0, temperature: 1, cpu: 2, signal: 3 };  // API metric name -> METRICS index
  var WINDOWS = [
    { label: '1 min', ms: 60000 },
    { label: '5 min', ms: 300000 },
    { label: '10 min', ms: 600000 }
  ];
  var TILES = [
    { key: 'valid', label: 'Received', sub: 'valid packets' },
    { key: 'rejected', label: 'Rejected', sub: 'failed validation' },
    { key: 'lost', label: 'Gaps', sub: 'missing at arrival; late ones also count' },
    { key: 'duplicates', label: 'Duplicates', sub: 'repeated sequence' },
    { key: 'out_of_order', label: 'Out of order', sub: 'late arrivals' },
    { key: 'restarts', label: 'Sender restarts', sub: 'sequence reset' },
    { key: 'alerts_raised', label: 'Alerts raised', sub: 'since ground station start' },
    { key: 'auth_failures', label: 'Auth failures', sub: 'forged, tampered or unsigned' },
    { key: 'replays', label: 'Replays', sub: 'repeated or stale packets' }
  ];

  var state = {
    samples: [], alerts: [], position: null, stats: null, serverTime: 0,
    online: false, loaded: false,
    windowMs: 300000, table: false, hover: {}, lastKey: ''
  };

  // ---------- small DOM helpers (all text goes through textContent) ----------
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function sv(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtTime(ts) {
    var d = new Date(ts);
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  function fmtNum(v, dec) { return v.toFixed(dec === undefined ? 1 : dec); }

  // ---------- axis math ----------
  function niceStep(raw) {
    var p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    var f = raw / p;
    var n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return n * p;
  }
  function niceTicks(lo, hi, target) {
    var step = niceStep((hi - lo) / target);
    var start = Math.floor(lo / step) * step;
    var end = Math.ceil(hi / step) * step;
    var t = [];
    for (var v = start; v <= end + step / 2; v += step) t.push(Math.round(v / step) * step);
    return t;
  }
  function tickDecimals(step) { return step >= 1 && step % 1 === 0 ? 0 : step % 1 === 0.5 ? 1 : 2; }
  function nearest(pts, t) {
    var lo = 0, hi = pts.length - 1;
    while (hi - lo > 1) {
      var mid = (lo + hi) >> 1;
      if (pts[mid].ts <= t) lo = mid; else hi = mid;
    }
    return Math.abs(pts[lo].ts - t) <= Math.abs(pts[hi].ts - t) ? lo : hi;
  }

  function visible() {
    var s = state.samples;
    if (!s.length) return [];
    var cut = s[s.length - 1].ts - state.windowMs;
    var i = 0;
    while (i < s.length && s[i].ts < cut) i++;
    return s.slice(i);
  }

  // ---------- status chip: always icon + label, never colour alone ----------
  function renderStatus() {
    var icon = document.getElementById('status-icon');
    var label = document.getElementById('status-label');
    var detail = document.getElementById('status-detail');
    var kind, text, extra = '';
    var st = state.stats;

    if (!state.online && state.loaded) {
      kind = 'offline'; text = 'Offline'; extra = 'ground station unreachable, showing last data';
    } else if (!state.loaded) {
      kind = 'waiting'; text = 'Connecting';
    } else if (!st || st.last_rx_ms === null) {
      kind = 'waiting'; text = 'Waiting'; extra = 'no packets yet';
    } else {
      var age = Math.max(0, state.serverTime - st.last_rx_ms);
      var s = state.samples, gaps = [];
      for (var i = Math.max(1, s.length - 10); i < s.length; i++) gaps.push(s[i].ts - s[i - 1].ts);
      gaps.sort(function (a, b) { return a - b; });
      var median = gaps.length ? gaps[gaps.length >> 1] : 1000;
      var limit = Math.max(3000, 3 * median);
      if (age <= limit) { kind = 'live'; text = 'Live'; extra = 'last packet ' + (age / 1000).toFixed(1) + ' s ago'; }
      else { kind = 'stale'; text = 'Signal lost'; extra = 'no packets for ' + Math.round(age / 1000) + ' s'; }
    }

    icon.replaceChildren();
    if (kind === 'live') icon.appendChild(sv('circle', { cx: 8, cy: 8, r: 6, fill: 'var(--good)' }));
    else if (kind === 'stale') icon.appendChild(sv('path', { d: 'M8 1.5 15 14H1z', fill: 'var(--warn)' }));
    else if (kind === 'offline') icon.appendChild(sv('path', { d: 'M3 3l10 10M13 3 3 13', stroke: 'var(--crit)', 'stroke-width': 2.5, 'stroke-linecap': 'round', fill: 'none' }));
    else icon.appendChild(sv('circle', { cx: 8, cy: 8, r: 5.5, fill: 'none', stroke: 'var(--muted)', 'stroke-width': 2 }));
    label.textContent = text;
    detail.textContent = extra;
  }

  // ---------- metric cards ----------
  function buildCard(m) {
    var card = el('section', 'card');
    card.setAttribute('aria-labelledby', 'h-' + m.key);
    var head = el('div', 'card-head');
    var lab = el('h2', 'card-label', m.label);
    lab.id = 'h-' + m.key;
    var val = el('div', 'card-value');
    var num = el('span', 'num', '—');
    val.appendChild(num);
    val.appendChild(el('span', 'unit', m.unit));
    head.appendChild(lab);
    head.appendChild(val);

    var wrap = el('div', 'chart');
    var plot = el('div', 'plot');
    plot.tabIndex = 0;
    plot.setAttribute('role', 'img');
    var tip = el('div', 'tip');
    tip.hidden = true;
    wrap.appendChild(plot);
    wrap.appendChild(tip);
    card.appendChild(head);
    card.appendChild(wrap);

    m.ui = { card: card, num: num, wrap: wrap, plot: plot, tip: tip };
    m.geo = null;

    plot.addEventListener('pointermove', function (e) {
      if (!m.geo) return;
      var r = plot.getBoundingClientRect();
      var g = m.geo;
      var t = g.t0 + (e.clientX - r.left - g.ml) / g.pw * (g.t1 - g.t0);
      state.hover[m.key] = g.pts[nearest(g.pts, t)].ts;
      updateHover(m);
    });
    plot.addEventListener('pointerleave', function () { clearHover(m); });
    plot.addEventListener('focus', function () {
      if (m.geo && state.hover[m.key] == null) {
        state.hover[m.key] = m.geo.pts[m.geo.pts.length - 1].ts;
        updateHover(m);
      }
    });
    plot.addEventListener('blur', function () { clearHover(m); });
    plot.addEventListener('keydown', function (e) {
      if (!m.geo) return;
      var pts = m.geo.pts;
      var cur = state.hover[m.key] == null ? pts.length - 1 : nearest(pts, state.hover[m.key]);
      if (e.key === 'ArrowLeft') cur = Math.max(0, cur - 1);
      else if (e.key === 'ArrowRight') cur = Math.min(pts.length - 1, cur + 1);
      else if (e.key === 'Home') cur = 0;
      else if (e.key === 'End') cur = pts.length - 1;
      else return;
      e.preventDefault();
      state.hover[m.key] = pts[cur].ts;
      updateHover(m);
    });
    return card;
  }

  function clearHover(m) {
    delete state.hover[m.key];
    updateHover(m);
  }

  function draw(m) {
    var ui = m.ui, pts = visible();
    var W = Math.floor(ui.wrap.clientWidth);
    if (!pts.length || W < 120) return;

    var H = 190, ml = 46, mr = 14, mt = 10, mb = 26;
    var pw = W - ml - mr, ph = H - mt - mb;

    var lo = Infinity, hi = -Infinity;
    for (var i = 0; i < pts.length; i++) {
      var v = pts[i][m.key];
      if (v < lo) lo = v;
      if (v > hi) hi = v;
    }
    var d0, d1, ticks;
    if (m.domain) {
      d0 = m.domain[0]; d1 = m.domain[1];
      var q = (d1 - d0) / 4;
      ticks = [d0, d0 + q, d0 + 2 * q, d0 + 3 * q, d1];
    } else {
      var span = hi - lo;
      if (span < m.minSpan) { var mid = (hi + lo) / 2; lo = mid - m.minSpan / 2; hi = mid + m.minSpan / 2; span = m.minSpan; }
      ticks = niceTicks(lo - span * 0.1, hi + span * 0.1, 4);
      d0 = ticks[0]; d1 = ticks[ticks.length - 1];
    }
    var dec = tickDecimals(ticks.length > 1 ? ticks[1] - ticks[0] : 1);

    var t1 = pts[pts.length - 1].ts, t0 = pts[0].ts;
    if (t1 - t0 < 1000) t0 = t1 - 30000;
    function X(t) { return ml + (t - t0) / (t1 - t0) * pw; }
    function Y(v) { return mt + ph - (v - d0) / (d1 - d0) * ph; }

    var svg = sv('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, 'aria-hidden': 'true' });

    ticks.forEach(function (tv) {
      var y = Math.round(Y(tv)) + 0.5;
      svg.appendChild(sv('line', { x1: ml, x2: W - mr, y1: y, y2: y, 'class': tv === d0 ? 'axisline' : 'gridline' }));
      var t = sv('text', { x: ml - 8, y: y + 4, 'text-anchor': 'end', 'class': 'tick' });
      t.textContent = fmtNum(tv, dec);
      svg.appendChild(t);
    });

    var xt = W < 420 ? 3 : 5;
    for (var k = 0; k < xt; k++) {
      var tt = t0 + (t1 - t0) * k / (xt - 1);
      var anchor = k === 0 ? 'start' : k === xt - 1 ? 'end' : 'middle';
      var lx = sv('text', { x: X(tt), y: H - 6, 'text-anchor': anchor, 'class': 'tick' });
      lx.textContent = fmtTime(tt);
      svg.appendChild(lx);
    }

    var d = '';
    for (var j = 0; j < pts.length; j++) {
      d += (j ? 'L' : 'M') + X(pts[j].ts).toFixed(1) + ' ' + Y(pts[j][m.key]).toFixed(1);
    }
    var base = mt + ph;
    svg.appendChild(sv('path', { d: d + 'L' + X(t1).toFixed(1) + ' ' + base + 'L' + X(pts[0].ts).toFixed(1) + ' ' + base + 'Z', 'class': 'area' }));
    svg.appendChild(sv('path', { d: d, 'class': 'line' }));

    var last = pts[pts.length - 1];
    svg.appendChild(sv('circle', { cx: X(last.ts), cy: Y(last[m.key]), r: 4, 'class': 'dot' }));

    var xh = sv('line', { y1: mt, y2: mt + ph, 'class': 'xhair' });
    var hd = sv('circle', { r: 4, 'class': 'dot' });
    xh.style.display = 'none';
    hd.style.display = 'none';
    svg.appendChild(xh);
    svg.appendChild(hd);

    ui.plot.replaceChildren(svg);
    ui.plot.setAttribute('aria-label',
      m.label + ': latest ' + fmtNum(last[m.key]) + ' ' + m.unit + ', range ' + fmtNum(lo) + ' to ' + fmtNum(hi) +
      ' ' + m.unit + '. Arrow keys step through samples; table view lists every value.');
    m.geo = { pts: pts, X: X, Y: Y, W: W, ml: ml, mt: mt, pw: pw, t0: t0, t1: t1, xh: xh, hd: hd };
    updateHover(m);
  }

  function updateHover(m) {
    var g = m.geo, tip = m.ui.tip, ts = state.hover[m.key];
    var pt = null;
    if (g && ts != null) {
      var p = g.pts[nearest(g.pts, ts)];
      if (p.ts === ts) pt = p;
    }
    if (!pt) {
      tip.hidden = true;
      if (g) { g.xh.style.display = 'none'; g.hd.style.display = 'none'; }
      return;
    }
    var x = g.X(pt.ts), y = g.Y(pt[m.key]);
    g.xh.setAttribute('x1', x); g.xh.setAttribute('x2', x); g.xh.style.display = '';
    g.hd.setAttribute('cx', x); g.hd.setAttribute('cy', y); g.hd.style.display = '';

    tip.replaceChildren();
    tip.appendChild(el('div', 'tip-time', fmtTime(pt.ts) + ' · packet ' + pt.seq));
    var row = el('div', 'tip-row');
    row.appendChild(el('span', 'tip-key'));
    row.appendChild(el('span', 'tip-val', fmtNum(pt[m.key], 2) + ' ' + m.unit));
    row.appendChild(el('span', 'tip-name', m.label));
    tip.appendChild(row);
    tip.hidden = false;
    var tw = tip.offsetWidth;
    var left = x + 14;
    if (left + tw > g.W - 4) left = x - 14 - tw;
    if (left < 4) left = 4;
    tip.style.left = left + 'px';
    tip.style.top = (g.mt + 4) + 'px';
  }

  // ---------- table view (the accessible twin of every chart) ----------
  function renderTable() {
    var t = document.getElementById('table');
    t.replaceChildren();
    var cap = el('caption', null, 'Most recent telemetry packets, newest first');
    t.appendChild(cap);
    var thead = el('thead'), hr = el('tr');
    ['Time', 'Packet', 'Battery %', 'Temperature °C', 'CPU %', 'Signal dBm'].forEach(function (h) {
      var th = el('th', null, h);
      th.scope = 'col';
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    t.appendChild(thead);
    var tb = el('tbody');
    var s = state.samples;
    for (var i = s.length - 1, n = 0; i >= 0 && n < 30; i--, n++) {
      var r = el('tr');
      r.appendChild(el('td', null, fmtTime(s[i].ts)));
      r.appendChild(el('td', null, String(s[i].seq)));
      r.appendChild(el('td', null, fmtNum(s[i].battery, 2)));
      r.appendChild(el('td', null, fmtNum(s[i].temp, 2)));
      r.appendChild(el('td', null, fmtNum(s[i].cpu, 2)));
      r.appendChild(el('td', null, fmtNum(s[i].signal, 2)));
      tb.appendChild(r);
    }
    t.appendChild(tb);
  }


  // ---------- alerts: icon + label + words, never colour alone ----------
  var SEV_WORD = { warning: 'Warning', critical: 'Critical' };
  function sevIcon(sev) {
    var svg = sv('svg', { 'class': 'ico', viewBox: '0 0 16 16', 'aria-hidden': 'true' });
    if (sev === 'critical') {
      svg.appendChild(sv('circle', { cx: 8, cy: 8, r: 7, fill: 'var(--crit)' }));
      svg.appendChild(sv('path', { d: 'M5 5l6 6M11 5l-6 6', stroke: '#fff', 'stroke-width': 2, 'stroke-linecap': 'round' }));
    } else {
      svg.appendChild(sv('path', { d: 'M8 1.5 15 14H1z', fill: 'var(--warn)' }));
      svg.appendChild(sv('path', { d: 'M8 6v4M8 11.6v.4', stroke: '#0b0b0b', 'stroke-width': 1.8, 'stroke-linecap': 'round' }));
    }
    return svg;
  }
  function alertSentence(a, m) {
    var dir = a.side === 'low' ? 'below' : 'above';
    return m.label + ' ' + fmtNum(a.value) + ' ' + m.unit + ' is ' + dir + ' its ' + a.severity + ' limit';
  }
  function renderAlerts() {
    var host = document.getElementById('alerts');
    host.replaceChildren();
    var byMetric = {};
    state.alerts.forEach(function (a) { byMetric[a.metric] = a; });

    state.alerts.slice().sort(function (x, y) {
      return (y.severity === 'critical') - (x.severity === 'critical');
    }).forEach(function (a) {
      var m = METRICS[METRIC_BY_KEY[a.metric]];
      var row = el('div', 'alert ' + a.severity);
      row.appendChild(sevIcon(a.severity));
      row.appendChild(el('span', 'a-title', SEV_WORD[a.severity]));
      row.appendChild(el('span', 'a-detail', alertSentence(a, m) + ' \u00b7 since ' + fmtTime(a.since)));
      host.appendChild(row);
    });

    METRICS.forEach(function (m, i) {
      var a = null;
      for (var k in METRIC_BY_KEY) if (METRIC_BY_KEY[k] === i && byMetric[k]) a = byMetric[k];
      var old = m.ui.card.querySelector('.badge');
      if (old) old.remove();
      m.ui.card.classList.toggle('has-alert', !!a);
      if (a) {
        var b = el('span', 'badge');
        b.appendChild(sevIcon(a.severity));
        b.appendChild(document.createTextNode(SEV_WORD[a.severity]));
        m.ui.card.querySelector('.card-label').appendChild(b);
      }
    });
  }


  // ---------- security events: counts of refused packets, with an icon and words ----------
  function renderSecurity() {
    var host = document.getElementById('security');
    host.replaceChildren();
    var st = state.stats;
    if (!st) return;
    var auth = num(st.auth_failures) || 0, rep = num(st.replays) || 0;
    if (auth + rep === 0) return;
    var row = el('div', 'sec-banner');
    row.appendChild(sevIcon('critical'));
    row.appendChild(el('span', 'a-title', 'Security events'));
    var parts = [];
    if (auth) parts.push(auth + ' packet' + (auth === 1 ? '' : 's') + ' failed authentication or were unsigned');
    if (rep) parts.push(rep + ' replayed or stale packet' + (rep === 1 ? '' : 's') + ' refused');
    row.appendChild(el('span', 'a-detail', parts.join(' \u00b7 ') + '. None were charted.'));
    host.appendChild(row);
  }


  // ---------- world map: equirectangular, drawn in SVG with no external tiles or data ----------
  var MAP_W = 720, MAP_H = 360;
  function mx(lon) { return (lon + 180) / 360 * MAP_W; }
  function my(lat) { return (90 - lat) / 180 * MAP_H; }

  // Split a track into runs that never cross the +/-180 meridian, so a path leaving the right edge
  // re-enters on the left instead of drawing a line across the whole map.
  function trackRuns(track) {
    var runs = [], cur = [];
    for (var i = 0; i < track.length; i++) {
      if (cur.length && Math.abs(track[i][1] - cur[cur.length - 1][1]) > 180) { runs.push(cur); cur = []; }
      cur.push(track[i]);
    }
    if (cur.length) runs.push(cur);
    return runs;
  }
  function pathOf(run) {
    var d = '';
    for (var i = 0; i < run.length; i++) d += (i ? 'L' : 'M') + mx(run[i][1]).toFixed(1) + ' ' + my(run[i][0]).toFixed(1);
    return d;
  }

  function renderMap() {
    var card = document.getElementById('mapcard');
    var p = state.position;
    card.hidden = !p;
    if (!p) return;
    var host = document.getElementById('map');
    // The drawing is 720 units wide and scaled to the container, which shrinks text with it. Pick
    // sizes in drawing units that come out at about 11 px (ticks) and 12 px (label) on screen.
    var shown = Math.max(200, host.clientWidth || MAP_W);
    var unit = MAP_W / shown;
    var tickPx = Math.round(11 * unit * 10) / 10, labelPx = Math.round(12.5 * unit * 10) / 10;

    var svg = sv('svg', { viewBox: '0 0 ' + MAP_W + ' ' + MAP_H, preserveAspectRatio: 'xMidYMid meet', 'aria-hidden': 'true' });
    svg.appendChild(sv('rect', { x: 0, y: 0, width: MAP_W, height: MAP_H, 'class': 'map-ocean' }));
    // No day/night shading on purpose. The satellite's shadow state comes from its orbital phase (what
    // drives the battery and temperature it reports), not from where the Sun is over the Earth, so a
    // shaded half-map would contradict "in Earth's shadow" whenever the two models disagree, which they
    // do. The state is shown in words and by the sun or moon beside the satellite instead.

    for (var lon = -150; lon <= 150; lon += 30) {
      svg.appendChild(sv('line', { x1: mx(lon), x2: mx(lon), y1: 0, y2: MAP_H, 'class': 'map-grid' }));
      // Label every 30 degrees when there is room, every 60 on a narrow screen (labels would collide).
      if (shown >= 560 || lon % 60 === 0) {
        var tl = sv('text', { x: mx(lon), y: MAP_H - 3, 'text-anchor': 'middle', 'class': 'map-tick', 'font-size': tickPx });
        tl.textContent = Math.abs(lon) + '\u00b0' + (lon < 0 ? 'W' : 'E');
        svg.appendChild(tl);
      }
    }
    for (var lat = -60; lat <= 60; lat += 30) {
      svg.appendChild(sv('line', { x1: 0, x2: MAP_W, y1: my(lat), y2: my(lat), 'class': lat === 0 ? 'map-equator' : 'map-grid' }));
      var ll = sv('text', { x: 3, y: my(lat) - 3, 'class': 'map-tick', 'font-size': tickPx });
      ll.textContent = Math.abs(lat) + '\u00b0' + (lat < 0 ? 'S' : lat > 0 ? 'N' : '');
      svg.appendChild(ll);
    }

    // Ground track: the first half of the sampled track is the past, the second half is ahead.
    var half = p.now;   // index of "now" in the track; the satellite is drawn there
    trackRuns(p.track.slice(0, half + 1)).forEach(function (r) { if (r.length > 1) svg.appendChild(sv('path', { d: pathOf(r), 'class': 'map-trail' })); });
    trackRuns(p.track.slice(half)).forEach(function (r) { if (r.length > 1) svg.appendChild(sv('path', { d: pathOf(r), 'class': 'map-ahead' })); });

    // Satellite: a filled dot with a ring. Shape and a text label identify it, not colour alone.
    var sx = mx(p.lon), sy = my(p.lat);
    svg.appendChild(sv('circle', { cx: sx, cy: sy, r: 11 * Math.max(1, unit * 0.8), 'class': 'map-sat-ring' }));
    svg.appendChild(sv('circle', { cx: sx, cy: sy, r: 5 * Math.max(1, unit * 0.8), 'class': 'map-sat' }));
    var lab = sv('text', { x: sx + (sx > MAP_W - 90 * unit ? -14 * unit : 14 * unit), y: sy + 4 * unit, 'text-anchor': sx > MAP_W - 90 * unit ? 'end' : 'start', 'class': 'map-label', 'font-size': labelPx });
    lab.textContent = 'Satellite ' + (p.sunlit ? '\u2600' : '\u263e');
    svg.appendChild(lab);

    host.replaceChildren(svg);

    var where = Math.abs(p.lat).toFixed(1) + '\u00b0' + (p.lat < 0 ? 'S' : 'N') + ', ' +
                Math.abs(p.lon).toFixed(1) + '\u00b0' + (p.lon < 0 ? 'W' : 'E');
    host.setAttribute('aria-label', 'Satellite ground track. The satellite is at ' + where + ', ' + (p.sunlit ? 'in sunlight' : 'in Earth\u2019s shadow') + '.');
    document.getElementById('map-sub').textContent = p.inc.toFixed(1) + '\u00b0 inclination \u00b7 ' + (p.period / 60).toFixed(0) + ' min orbit \u00b7 simplified model';
    document.getElementById('map-readout').textContent = where + ' \u00b7 ' + (p.sunlit ? 'in sunlight' : 'in Earth\u2019s shadow');

    var lg = document.getElementById('map-legend');
    if (!lg.firstChild) {
      var items = [['trail', 'Path so far'], ['ahead', 'Path ahead']];
      items.forEach(function (it) {
        var s = el('span');
        var k = sv('svg', { viewBox: '0 0 22 10', 'aria-hidden': 'true' });
        k.appendChild(sv('line', { x1: 1, x2: 21, y1: 5, y2: 5, 'class': it[0] === 'trail' ? 'map-trail' : 'map-ahead' }));
        s.appendChild(k);
        s.appendChild(document.createTextNode(it[1]));
        lg.appendChild(s);
      });
    }
  }

  // ---------- rendering ----------
  var tileValues = {};
  function buildTiles() {
    var host = document.getElementById('tiles');
    TILES.forEach(function (d) {
      var tile = el('div', 'tile');
      tile.appendChild(el('div', 't-label', d.label));
      var v = el('div', 't-value', '—');
      tileValues[d.key] = v;
      tile.appendChild(v);
      tile.appendChild(el('div', 't-sub', d.sub));
      host.appendChild(tile);
    });
  }

  function render() {
    renderStatus();
    renderAlerts();
    renderSecurity();
    renderMap();
    var has = state.samples.length > 0;
    document.getElementById('empty').hidden = has || !state.loaded;
    document.getElementById('charts').hidden = !has || state.table;
    document.getElementById('table-view').hidden = !has || !state.table;

    if (state.stats) {
      TILES.forEach(function (d) { tileValues[d.key].textContent = String(state.stats[d.key]); });
    }
    if (has) {
      var last = state.samples[state.samples.length - 1];
      METRICS.forEach(function (m) { m.ui.num.textContent = fmtNum(last[m.key]); });
      if (state.table) renderTable();
      else METRICS.forEach(draw);
    }
  }

  // ---------- data ----------
  function num(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
  function accept(d) {
    if (!d || !Array.isArray(d.samples) || !d.stats || num(d.server_time_ms) === null) throw new Error('bad payload');
    var out = [];
    d.samples.forEach(function (s) {
      var p = { seq: num(s.seq), ts: num(s.ts), battery: num(s.battery), temp: num(s.temp), cpu: num(s.cpu), signal: num(s.signal) };
      for (var k in p) if (p[k] === null) return;
      out.push(p);
    });
    var al = [];
    (Array.isArray(d.alerts) ? d.alerts : []).forEach(function (a) {
      if (!a || (a.severity !== 'warning' && a.severity !== 'critical')) return;
      if (a.side !== 'low' && a.side !== 'high') return;
      if (!Object.prototype.hasOwnProperty.call(METRIC_BY_KEY, a.metric) || num(a.value) === null || num(a.since_ms) === null) return;
      al.push({ metric: a.metric, severity: a.severity, side: a.side, value: a.value, since: a.since_ms });
    });
    state.alerts = al;
    state.position = null;
    var pz = d.position;
    if (pz && typeof pz === 'object' && num(pz.lat) !== null && num(pz.lon) !== null &&
        Math.abs(pz.lat) <= 90 && Math.abs(pz.lon) <= 180) {
      var tr = [];
      (Array.isArray(pz.track) ? pz.track : []).forEach(function (q) {
        if (Array.isArray(q) && q.length === 2 && num(q[0]) !== null && num(q[1]) !== null &&
            Math.abs(q[0]) <= 90 && Math.abs(q[1]) <= 180) tr.push([q[0], q[1]]);
      });
      state.position = {
        lat: pz.lat, lon: pz.lon, sunlit: pz.sunlit === true,
        now: Math.max(0, Math.min(tr.length - 1, num(pz.track_now_index) || 0)),
        t: num(pz.orbit_time_s) || 0, inc: num(pz.inclination_deg) || 0, period: num(pz.period_s) || 0, track: tr
      };
    }
    state.samples = out;
    state.stats = d.stats;
    state.serverTime = d.server_time_ms;
    state.online = true;
    state.loaded = true;
  }

  function poll() {
    if (document.hidden) { setTimeout(poll, 1000); return; }
    var ctrl = new AbortController();
    var to = setTimeout(function () { ctrl.abort(); }, 2000);
    fetch('/api/telemetry?n=600', { cache: 'no-store', signal: ctrl.signal })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (d) { clearTimeout(to); accept(d); render(); })
      .catch(function () { clearTimeout(to); state.online = false; renderStatus(); })
      .then(function () { setTimeout(poll, 1000); });
  }

  // ---------- init ----------
  (function init() {
    var charts = document.getElementById('charts');
    METRICS.forEach(function (m) { charts.appendChild(buildCard(m)); });
    buildTiles();

    var seg = document.getElementById('windows');
    WINDOWS.forEach(function (w) {
      var b = el('button', null, w.label);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(w.ms === state.windowMs));
      b.addEventListener('click', function () {
        state.windowMs = w.ms;
        Array.prototype.forEach.call(seg.children, function (c) { c.setAttribute('aria-pressed', String(c === b)); });
        render();
      });
      seg.appendChild(b);
    });

    var tg = document.getElementById('table-toggle');
    tg.addEventListener('click', function () {
      state.table = !state.table;
      tg.setAttribute('aria-pressed', String(state.table));
      render();
    });

    if (window.ResizeObserver) {
      new ResizeObserver(function () { if (!state.table) METRICS.forEach(draw); renderMap(); }).observe(charts);
    }
    renderStatus();
    poll();
  })();
})();
</script>
</body>
</html>
